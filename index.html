<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUHAMMAD IDHAM - Digital CV</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ========================================================================== */
        /* [1] GLOBAL THEMES (UPDATED: MUTED "FROSTED STEEL" INSTEAD OF WHITE)        */
        /* ========================================================================== */

        :root {
            --bg-color: #c4d1df;         /* Cool steel blue-grey (no harsh whites) */
            --text-main: #111a24;        /* Very dark navy/grey for soft readability */
            --header-color: #084c82;     /* Deep industrial tech blue */
            --bold-color: #c74b00;       /* Burnt orange (matching the nodes) */
            --outline-color: #2b7aab;    /* Muted cyan for borders */
            --card-bg: #d0dce8E6;        /* Frosted slate-blue card background (90% opacity) */
            --header-bg: #c4d1dfF2;      /* Frosted steel header */
            --bg-image-opacity: 0.15;    /* Lower opacity so dark image doesn't clash */
            --scroll-color: #ff7b00;     /* Orange scrollbar */
        }

        [data-theme="dark"] {
            --bg-color: #030b14;         /* Very dark navy / almost black */
            --text-main: #e6f1ff;        /* Off-white blueish text */
            --header-color: #00e5ff;     /* Neon cyan (matching the glowing lines) */
            --bold-color: #ff7b00;       /* Neon orange (matching glowing nodes) */
            --outline-color: #0077b6;    /* Mid-tone blue for borders */
            --card-bg: #0a1128CC;        /* Dark transparent blue */
            --header-bg: #030b14E6;      /* Dark frosted header */
            --bg-image-opacity: 0.6;     /* Higher opacity to let the image shine */
            --scroll-color: #00e5ff;     /* Neon cyan scrollbar */
        }

        /* ========================================================================== */
        /* [2] BASE LAYOUT                                                            */
        /* ========================================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            transition: background-color 0.4s ease, color 0.4s ease, border-color 0.4s ease;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* ========================================================================== */
        /* [3] BACKGROUND EFFECTS                                                     */
        /* ========================================================================== */

        .bg-fallback {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh; z-index: -3;
            background-color: var(--bg-color);
            background-image:
                radial-gradient(var(--header-color) 2px, transparent 2px),
                radial-gradient(var(--outline-color) 2px, transparent 2px);
            background-size: 40px 40px, 60px 60px;
            background-position: 0 0, 20px 20px;
            opacity: 0.15;
        }

        .bg-image {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2;
            background-image: url('background.webp');
            background-size: 100% auto; background-repeat: repeat-y;
            background-attachment: fixed; background-position: top center;
            opacity: var(--bg-image-opacity); transition: opacity 0.4s ease;
        }

        /* ========================================================================== */
        /* [4] SCROLL PROGRESS BAR                                                    */
        /* ========================================================================== */

        .scroll-progress-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 3px;
            background-color: transparent; z-index: 1001;
        }

        .scroll-progress-bar {
            height: 100%; width: 0%;
            background-color: var(--scroll-color);
            box-shadow: 0 0 8px 2px var(--scroll-color);
            border-radius: 0 2px 2px 0; transition: width 0.5s ease-out;
        }

        /* ========================================================================== */
        /* [5] GLOBAL HEADER                                                          */
        /* ========================================================================== */

        header.global-header {
            position: fixed; top: 0; left: 0; width: 100%;
            background-color: var(--header-bg); backdrop-filter: blur(10px);
            box-shadow: 0 2px 10px #0000001A; display: flex;
            justify-content: space-between; align-items: center;
            padding: 1rem 5%; z-index: 1000; border-bottom: 2px solid var(--outline-color);
        }

        .header-left-group { display: flex; gap: 10px; align-items: center; }

        .nav-btn {
            background: none; border: 2px solid var(--outline-color);
            color: var(--header-color); font-size: 1.1rem;
            border-radius: 50%; width: 40px; height: 40px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; text-decoration: none;
        }

        .nav-btn:hover {
            transform: scale(1.1); background-color: var(--outline-color); color: var(--bg-color);
        }

        .global-title {
            position: absolute; left: 50%; transform: translateX(-50%);
            font-size: clamp(0.7rem, 2vw, 1.2rem); font-weight: 700; text-transform: uppercase;
            letter-spacing: 1px; text-align: center; color: var(--header-color);
            max-width: 45vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .theme-toggle {
            background: none; border: none; color: var(--outline-color);
            font-size: 1.4rem; cursor: pointer;
        }

        /* ========================================================================== */
        /* [6] MAIN CONTENT & GLOBAL CARD BASE                                        */
        /* ========================================================================== */

        main {
            padding: 110px 5% 4rem 5%; flex: 1; max-width: 800px;
            margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 2rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 2px solid var(--outline-color);
            border-radius: 12px;
            box-shadow: 0 8px 20px #0000000D;
            backdrop-filter: blur(5px);
        }

        /* ========================================================================== */
        /* [7] SMART THEME SCOPING (PREVENTS DESIGN CONFLICTS ACROSS PAGES)           */
        /* ========================================================================== */
        
        /* ---> SCOPE FOR HOME STYLES <--- */
        .theme-home .card { padding: 2rem; animation: fadeUp 0.6s ease-out forwards; }
        .theme-home .caps-bullet { list-style: none; display: flex; flex-direction: column; gap: 0.8rem; }
        .theme-home .caps-bullet li { font-weight: 600; text-transform: uppercase; color: var(--text-main); display: flex; gap: 10px; align-items: flex-start; }
        .theme-home .caps-bullet li i { color: var(--bold-color); margin-top: 5px; }

        /* ---> SCOPE FOR PAGE 1-4, 6-7 STYLES <--- */
        .theme-page1 .card, .theme-page2 .card, .theme-page3 .card, .theme-page4 .card { padding: 1.5rem 2rem; animation: fadeUp 0.6s ease-out forwards;}
        .theme-page5 .card, .theme-page6 .card, .theme-page7 .card { padding: 1.5rem 2rem; display: flex; flex-direction: column; animation: fadeUp 0.6s ease-out forwards;}

        .theme-page1 .caps-bullet, .theme-page2 .caps-bullet, .theme-page3 .caps-bullet, .theme-page4 .caps-bullet, .theme-page6 .caps-bullet, .theme-page7 .caps-bullet { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }
        .theme-page1 .caps-bullet li, .theme-page2 .caps-bullet li, .theme-page3 .caps-bullet li, .theme-page4 .caps-bullet li, .theme-page6 .caps-bullet li, .theme-page7 .caps-bullet li { font-weight: 600; text-transform: uppercase; color: var(--text-main); display: flex; align-items: flex-start; }
        .theme-page1 .caps-bullet li::before, .theme-page2 .caps-bullet li::before, .theme-page3 .caps-bullet li::before, .theme-page4 .caps-bullet li::before, .theme-page6 .caps-bullet li::before, .theme-page7 .caps-bullet li::before { content: '▸'; color: var(--bold-color); font-size: 1.2rem; margin-right: 10px; line-height: 1; }

        /* ---> SCOPE FOR PAGE 5 STYLES <--- */
        .theme-page5 .caps-bullet { list-style: none; display: flex; flex-direction: column; gap: 1.5rem; margin-bottom: 1rem; }
        .theme-page5 .caps-bullet li { font-weight: 600; text-transform: uppercase; color: var(--text-main); display: flex; flex-direction: column; align-items: flex-start; text-align: left; }

        /* ========================================================================== */
        /* [8] HOME SPECIFIC CLASSES                                                  */
        /* ========================================================================== */

        .section-header {
            font-size: 1.8rem; font-weight: 700; color: var(--header-color);
            text-transform: uppercase; border-bottom: 2px dashed var(--outline-color);
            padding-bottom: 0.5rem; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 15px;
        }

        strong, b { color: var(--bold-color); font-weight: 700; }
        .hero { text-align: center; }
        
        .profile-img {
            width: 180px; height: 180px; border-radius: 25px; object-fit: cover;
            border: 5px solid var(--outline-color); padding: 5px;
            display: block; margin: 0 auto 1.5rem auto; animation: float 4s ease-in-out infinite;
        }

        .hero-title { font-size: 1.3rem; font-weight: 700; color: var(--header-color); text-transform: uppercase; margin-bottom: 1rem; }
        .hero-desc { font-size: 1rem; text-align: justify; }
        .cv-intro-text { font-size: 1.1rem; font-weight: 600; color: var(--text-main); text-align: justify; margin-bottom: 1.5rem; border-left: 4px solid var(--bold-color); padding-left: 15px; }
        
        .menu-grid { display: flex; flex-direction: column; gap: 1rem; scroll-margin-top: 100px; }
        .menu-btn {
            padding: 1.2rem 2rem; background-color: var(--card-bg); color: var(--header-color);
            border: 2px solid var(--outline-color); border-left: 8px solid var(--outline-color);
            border-radius: 8px; font-size: 1.1rem; font-weight: 700; text-transform: uppercase;
            text-decoration: none; display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 10px #0000000D; transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .menu-btn:hover { transform: translateX(10px); box-shadow: 0 6px 15px #f39c124D; }
        
        #contact-section { scroll-margin-top: 100px; }
        .contact-list { display: flex; flex-direction: column; gap: 1.2rem; margin-bottom: 2rem; }
        .contact-card {
            display: flex; align-items: center; gap: 15px; padding: 12px; border-radius: 12px;
            background-color: var(--card-bg); border: 2px solid var(--outline-color); text-decoration: none;
            transition: transform 0.2s ease;
        }
        .contact-card:hover { transform: scale(1.02); box-shadow: 0 4px 15px #f39c1233; }
        .contact-card:hover .info-detail { color: var(--bold-color); }
        
        .icon-box { width: 55px; height: 55px; border-radius: 10px; display: flex; justify-content: center; align-items: center; color: #ffffff; font-size: 1.8rem; flex-shrink: 0; }
        .info-box { display: flex; flex-direction: column; text-align: left; }
        .info-action { font-size: 0.85rem; font-weight: 700; color: var(--header-color); text-transform: uppercase; }
        .info-detail { font-size: 1.1rem; font-weight: 700; color: var(--text-main); }
        
        .bg-wa { background-color: #25D366; } .bg-email { background-color: #ea4335; } .bg-work { background-color: #0077b5; }
        .bg-li { background-color: #0077b5; } .bg-fb { background-color: #1877f2; } .bg-gh { background-color: #333333; }
        .bg-ig { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
        
        #linkedin-widget-container { position: relative; width: 100%; display: flex; justify-content: center; min-height: 81px; }
        .li-badge-light, .li-badge-dark { display: none; width: 100%; }
        body:not([data-theme="dark"]) .li-badge-light.badge-ready { display: block; }
        body[data-theme="dark"] .li-badge-dark.badge-ready { display: block; }
        #linkedin-widget-container.linkedin-loaded #li-fallback-btn { display: none !important; }

        /* ========================================================================== */
        /* [9] PAGE 1-7 SPECIFIC CLASSES                                              */
        /* ========================================================================== */

        .page-title {
            font-size: 2rem; color: var(--header-color); text-transform: uppercase;
            background-color: var(--card-bg); border: 2px solid var(--outline-color);
            border-radius: 12px; padding: 1rem 1.5rem; box-shadow: 0 8px 20px #0000000D;
            display: flex; align-items: center; gap: 15px; margin-bottom: 1.5rem;
        }
        
        .sub-section-title {
            font-size: 1.5rem; color: var(--header-color); text-transform: uppercase;
            margin-top: 1.5rem; margin-bottom: 1rem; font-weight: 700; display: flex; align-items: center; gap: 10px;
            background-color: var(--card-bg); padding: 0.8rem 1.5rem; border-radius: 8px; border-left: 6px solid var(--bold-color);
        }

        .timeline {
            border-left: 3px solid var(--outline-color); margin-left: 15px; padding-left: 30px;
            display: flex; flex-direction: column; gap: 2.5rem; margin-top: 1rem; margin-bottom: 2rem;
        }
        
        .timeline-item { position: relative; animation: fadeUp 0.6s ease-out forwards; }
        .timeline-item::before {
            content: ''; position: absolute; left: -39px; top: 15px; width: 15px; height: 15px;
            background-color: var(--bold-color); border-radius: 50%; box-shadow: 0 0 0 5px var(--bg-color); z-index: 1;
        }
        
        .badge-year {
            display: inline-block; background-color: var(--outline-color); color: var(--bg-color); padding: 5px 15px;
            border-radius: 20px; font-weight: 700; text-transform: uppercase; font-size: 0.9rem; margin-bottom: 10px;
            align-self: flex-start;
        }

        .caps-header { font-size: 1.3rem; font-weight: 700; color: var(--header-color); text-transform: uppercase; margin-bottom: 0.2rem; }
        .caps-sub { font-weight: 600; color: var(--bold-color); text-transform: uppercase; margin-bottom: 1rem; font-size: 1rem; }
        .caps-mini-header {
            font-size: 0.95rem; font-weight: 700; color: var(--header-color); text-transform: uppercase; margin-top: 1rem; margin-bottom: 0.3rem;
            border-bottom: 1px dashed var(--outline-color); padding-bottom: 3px; display: inline-block;
        }

        /* PAGE 4 Classes */
        .placeholder-card {
            text-align: center; padding: 3rem 1.5rem; border: 2px dashed var(--outline-color);
            background-color: transparent; box-shadow: none; border-radius: 12px; animation: fadeUp 0.6s ease-out forwards;
            justify-content: center; align-items: center;
        }
        .placeholder-icon { font-size: 3rem; color: var(--header-color); margin-bottom: 1rem; opacity: 0.7; }
        .placeholder-title { font-size: 1.2rem; font-weight: 700; color: var(--text-main); text-transform: uppercase; margin-bottom: 0.5rem; }
        .placeholder-desc { font-size: 1rem; color: var(--text-main); opacity: 0.8; }

        /* PAGE 5 Classes */
        .skills-grid { display: flex; flex-direction: column; gap: 2rem; }
        .skill-title {
            color: var(--header-color); font-weight: 700; text-transform: uppercase; margin-bottom: 0.3rem;
            display: flex; align-items: center; gap: 10px; font-size: 1.05rem; letter-spacing: 0.5px;
        }
        .skill-title i { color: var(--bold-color); font-size: 1.2rem; }
        .skill-desc { color: var(--text-main); font-weight: 500; line-height: 1.6; padding-left: 28px; }

        /* PAGE 6 Classes */
        .project-desc {
            color: var(--text-main); font-weight: 500; line-height: 1.6; text-align: justify;
            margin-bottom: 1rem; border-left: 3px solid var(--bold-color); padding-left: 15px;
        }
        
        .project-link {
            display: inline-flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 8px;
            background-color: var(--bg-color); border: 2px solid var(--outline-color); color: var(--text-main);
            font-weight: 700; text-transform: uppercase; text-decoration: none; font-size: 0.95rem; align-self: flex-start;
            transition: transform 0.3s ease, border-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
        }
        .project-link i { font-size: 1.2rem; color: var(--header-color); transition: color 0.3s ease; }
        .project-link:hover { transform: scale(1.02); border-color: var(--bold-color); color: var(--bold-color); box-shadow: 0 4px 15px #0a6a0a33; }
        .project-link:hover i { color: var(--bold-color); }
        
        .no-link {
            display: inline-flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 8px;
            background-color: transparent; border: 2px dashed #999; color: #777; font-weight: 600; text-transform: uppercase;
            font-size: 0.9rem; align-self: flex-start; cursor: not-allowed;
        }

        /* ========================================================================== */
        /* [10] ANIMATIONS & MEDIA QUERIES                                            */
        /* ========================================================================== */

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        @media (max-width: 600px) {
            main { padding-left: 4%; padding-right: 4%; }
            .theme-home .card { padding: 1.4rem; } 
            .section-header { font-size: 1.4rem; }
            .global-title { max-width: 38vw; }
            .profile-img { width: 150px; height: 150px; }
        }
    </style>
</head>
<body>

    <!-- ========================================================================== -->
    <!-- SCROLL PROGRESS BAR                                                        -->
    <!-- ========================================================================== -->
    <div class="scroll-progress-container">
        <div class="scroll-progress-bar" id="scrollProgress"></div>
    </div>

    <!-- ========================================================================== -->
    <!-- BACKGROUND LAYERS                                                          -->
    <!-- ========================================================================== -->
    <div class="bg-fallback"></div>
    <div class="bg-image"></div>

    <!-- ========================================================================== -->
    <!-- GLOBAL HEADER                                                              -->
    <!-- ========================================================================== -->
    <header class="global-header">
        <div class="header-left-group" id="dynamic-header-left">
            <!-- Buttons are injected automatically by the Javascript Router based on view -->
        </div>

        <span class="global-title">
            MUHAMMAD IDHAM BIN MOHD ARIF
        </span>

        <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Theme">
            <i class="fas fa-moon" id="themeIcon"></i>
        </button>
    </header>

    <!-- ========================================================================== -->
    <!-- MAIN CONTENT CANVAS (ROUTER TARGET)                                        -->
    <!-- ========================================================================== -->
    <main id="app-main-container">
        <!-- ALL EDITABLE WORD BOX VARIABLES ARE DYNAMICALLY RENDERED HERE -->
    </main>

    <!-- ========================================================================== -->
    <!-- JAVASCRIPT: LOGIC & FUNCTIONALITY                                          -->
    <!-- ========================================================================== -->
    <script>
        /* ====================================================================== */
        /* [1] THEME SYSTEM                                                       */
        /* ====================================================================== */
        const themeIcon = document.getElementById("themeIcon");

        function checkSavedTheme() {
            if (localStorage.getItem("theme") === "dark") {
                document.body.setAttribute("data-theme", "dark");
                themeIcon.className = "fas fa-sun";
            }
        }

        function toggleTheme() {
            if (document.body.getAttribute("data-theme") === "dark") {
                document.body.removeAttribute("data-theme");
                localStorage.setItem("theme", "light");
                themeIcon.className = "fas fa-moon";
            } else {
                document.body.setAttribute("data-theme", "dark");
                localStorage.setItem("theme", "dark");
                themeIcon.className = "fas fa-sun";
            }
        }

        /* ====================================================================== */
        /* [2] SCROLL PROGRESS                                                    */
        /* ====================================================================== */
        function updateScrollProgress() {
            const scrollTop = document.documentElement.scrollTop || document.body.scrollTop;
            const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            let scrollPercentage;
            if (scrollHeight <= 0) { scrollPercentage = 100; } 
            else { scrollPercentage = (scrollTop / scrollHeight) * 100; }
            document.getElementById("scrollProgress").style.width = scrollPercentage + "%";
        }

        window.addEventListener("scroll", updateScrollProgress);
        window.addEventListener("resize", updateScrollProgress);

        /* ====================================================================== */
        /* [3] LINKEDIN BADGE SYSTEM                                              */
        /* ====================================================================== */
        const ENABLE_LINKEDIN_BADGE = true;

        function initializeLinkedInBadge() {
            const container = document.getElementById("linkedin-widget-container");
            const fallbackBtn = document.getElementById("li-fallback-btn");
            const lightBadge = document.querySelector(".li-badge-light");
            const darkBadge = document.querySelector(".li-badge-dark");

            if (!ENABLE_LINKEDIN_BADGE) return;
            if (!container || !fallbackBtn || !lightBadge || !darkBadge) return;
            if (document.querySelector('script[data-linkedin-badge-script]')) return;

            const script = document.createElement("script");
            script.src = "https://platform.linkedin.com/badges/js/profile.js";
            script.async = true;
            script.defer = true;
            script.setAttribute("data-linkedin-badge-script", "true");

            script.onload = function () {
                let attempts = 0;
                const maxAttempts = 20;
                const checkBadge = setInterval(function () {
                    attempts++;
                    const iframe = container.querySelector("iframe");
                    if (iframe) {
                        clearInterval(checkBadge);
                        lightBadge.classList.add("badge-ready");
                        darkBadge.classList.add("badge-ready");
                        container.classList.add("linkedin-loaded");
                        return;
                    }
                    if (attempts >= maxAttempts) {
                        clearInterval(checkBadge);
                        fallbackBtn.style.display = "flex";
                    }
                }, 250);
            };

            script.onerror = function () { fallbackBtn.style.display = "flex"; };
            document.body.appendChild(script);
        }

        /* ====================================================================== */
        /* [4] SINGLE PAGE APPLICATION ROUTER (NEW METHOD)                        */
        /* ====================================================================== */
        function renderPage(pageVarName, targetSection = null) {
            const mainContainer = document.getElementById("app-main-container");
            const headerLeft = document.getElementById("dynamic-header-left");

            // Apply Theme Scoping class safely without touching inner HTML structure
            mainContainer.className = "theme-" + pageVarName;

            // Load Variable into View
            if (pageVarName === 'home') {
                mainContainer.innerHTML = home; // Ensure you have your `home` variable defined below or in another script
                headerLeft.innerHTML = `
                    <a href="#" onclick="renderPage('home'); return false;" class="nav-btn" title="Go to Home"><i class="fas fa-home"></i></a>
                    <a href="#menu-section" class="nav-btn" title="Go to CV Menu"><i class="fas fa-list"></i></a>
                    <a href="#contact-section" class="nav-btn" title="Go to Contact"><i class="fas fa-address-book"></i></a>
                `;
                setTimeout(initializeLinkedInBadge, 100);
            } else {
                let pageContent = "";
                switch(pageVarName) {
                    case 'page1': pageContent = page1; break;
                    case 'page2': pageContent = page2; break;
                    case 'page3': pageContent = page3; break;
                    case 'page4': pageContent = page4; break;
                    case 'page5': pageContent = page5; break;
                    case 'page6': pageContent = page6; break;
                    case 'page7': pageContent = page7; break;
                }
                mainContainer.innerHTML = pageContent;
                headerLeft.innerHTML = `
                    <a href="#" onclick="renderPage('home'); return false;" class="nav-btn" title="Go to Home"><i class="fas fa-home"></i></a>
                    <a href="#" onclick="renderPage('home', 'menu-section'); return false;" class="nav-btn" title="Back to Menu"><i class="fas fa-arrow-left"></i></a>
                `;
            }

            // Scroll Management
            if (targetSection) {
                setTimeout(() => {
                    const el = document.getElementById(targetSection);
                    if (el) el.scrollIntoView({ behavior: 'smooth' });
                }, 50);
            } else {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        /* ====================================================================== */
        /* [5] PAGE INITIALIZATION                                                */
        /* ====================================================================== */
        window.addEventListener("load", function () {
            checkSavedTheme();
            updateScrollProgress();
            renderPage('home'); // Loads Home by default
        });
    </script>


    <!-- 
    ██████████████████████████████████████████████████████████████████████████████
